<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce - example of array of objects</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">Audio Store</div>
      <button class="cart-btn">
        Cart
        <span class="cart-count" onclick="toggleCart()" id="cartCount">0</span>
      </button>
    </div>

    <div class="hero">
      <h1>Premium Audio Products</h1>
      <p>Quality sound for everyone</p>
    </div>

    <div class="products-grid" id="productsGrid"></div>

    <div class="cart-modal" id="cartModal">
      <div class="cart-content">
        <div class="cart-header">YOUR CART</div>
        <div id="cartItems"></div>
        <div class="cart-total">
          <span class="cart-total-label">Total:</span>
          <span class="cart-total-amount" id="cartTotal">$0</span>
        </div>
        <button class="close-btn" onclick="toggleCart()">CLOSE</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
